services:
  - type: web
    name: villacorz-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: VillaCorz/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /demo/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: VillaCorz
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://villacorz-api.onrender.com
      - key: FRONTEND_URL
        value: https://villacorz.vercel.app
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_DOMAIN
        value: "null"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: ASSISTANT_ENABLED
        value: "true"
      - key: ASSISTANT_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: FORECAST_SERVICE_URL
        value: https://villacorz-forecast.onrender.com

  - type: web
    name: villacorz-forecast
    runtime: python
    plan: free
    region: singapore
    rootDir: VillaCorz/forecasting-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
